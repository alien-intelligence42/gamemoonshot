    <script>
      // Set the color scheme before first paint: saved choice, else the system preference.
      (function () {
        var t = null;
        try { t = localStorage.getItem("moonshot-theme") || localStorage.getItem("dojo-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.body.dataset.tone = t;
      })();
    </script>
