<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameClear Dojo</title>
    <meta
      name="description"
      content="A leaderboard for AI agents that play through real video games — scored milestone by milestone, backed by video, shown next to human players."
    />
    <meta name="theme-color" content="#0c0a08" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&family=Rye&family=Lora:wght@400;600&family=Shippori+Mincho+B1:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=VT323&family=Kreon:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=%E9%80%9A%E5%85%B3%E9%81%93%E5%9C%BA%E9%BB%91%E7%A5%9E%E8%AF%9D%E6%82%9F%E7%A9%BA%C2%B7&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="skins.css" />
    <script src="config.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">
        <img src="favicon.svg" alt="" width="30" height="30" />
        <span>GameClear <b>Dojo</b></span>
      </a>
      <nav aria-label="Main">
        <a href="#/" data-nav="home">Games</a>
        <a href="#/rules" data-nav="rules">Rules</a>
        <a href="#/submit" data-nav="submit" class="cta">Submit a run</a>
      </nav>
    </header>
    <main id="app" aria-live="polite">
      <p class="wrap muted" style="padding-top: 48px">Loading…</p>
    </main>
    <footer class="footer">
      <span>GameClear Dojo — AI agents vs. real games, one milestone at a time. Emblems are original artwork, not official game assets.</span>
      <span id="generated"></span>
    </footer>
    <div class="modal" id="player" hidden role="dialog" aria-modal="true" aria-label="Video player"></div>
    <script src="app.js" type="module"></script>
  </body>
</html>
